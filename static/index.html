<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>LINE OA External Chat POC</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  html, body { margin: 0; height: 100%; background: #f4f4f4; }
  body { display: flex; height: 100dvh; overflow: hidden; }

  #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar h2 { font-size: 15px; padding: 14px 16px 8px; margin: 0; }
  #channel-bar { padding: 14px 16px 8px; }
  #channel-name { font-size: 15px; font-weight: 600; }
  #channel-select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-weight: 600; background: #fafafa; }
  #identity-bar { padding: 0 16px 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
  #identity-bar select { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; background: #fafafa; }
  #current-user-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #identity-bar button { padding: 6px 10px; border: 1px solid #ddd; background: #fafafa; border-radius: 8px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  #identity-bar button:hover { background: #eee; }
  #identity-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  #search-bar { padding: 0 16px 10px; border-bottom: 1px solid #eee; }
  #search-input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 16px; font-size: 14px; }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; position: relative; }
  .conv-item:hover, .conv-item.active { background: #e8f5e9; }
  .conv-item .name { font-weight: 600; font-size: 14px; }
  .conv-item .time { font-size: 11px; color: #888; margin-top: 2px; }
  .assign-badge { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
  .assign-badge.unassigned { background: #bbb; }
  #empty-list { padding: 16px; color: #999; font-size: 13px; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header { padding: 12px 16px; background: #06c755; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  #chat-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 0 4px 0 0; line-height: 1; }
  #assign-select { padding: 6px 8px; border-radius: 8px; border: none; font-size: 12px; max-width: 45%; }

  #tab-bar { display: flex; background: #fff; border-bottom: 1px solid #ddd; flex-shrink: 0; }
  .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-size: 13px; color: #777; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: #06c755; border-bottom-color: #06c755; font-weight: 600; }

  #tab-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  #quick-replies { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; background: #fafafa; border-bottom: 1px solid #eee; flex-shrink: 0; white-space: nowrap; }
  .qr-btn { flex-shrink: 0; padding: 6px 12px; border-radius: 14px; border: 1px solid #cde; background: #fff; color: #06834a; font-size: 12px; cursor: pointer; }
  .qr-btn:hover { background: #e8f5e9; }

  #messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg-row { display: flex; flex-direction: column; }
  .msg-row.in { align-items: flex-start; }
  .msg-row.out { align-items: flex-end; }
  .bubble-sender { font-size: 10px; color: #999; margin-bottom: 2px; padding: 0 4px; }
  .bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .bubble.in { background: #fff; border: 1px solid #eee; }
  .bubble.out { background: #06c755; color: #fff; }
  .bubble.media { padding: 6px; }
  .bubble.media img { max-width: 220px; max-height: 220px; border-radius: 8px; display: block; cursor: pointer; }
  .bubble.media a { color: inherit; text-decoration: underline; }

  #input-row { display: flex; align-items: center; padding: 10px; border-top: 1px solid #ddd; background: #fff; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #input-row input[type="text"] { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; }
  #input-row button { margin-left: 8px; padding: 10px 18px; background: #06c755; color: #fff; border: none; border-radius: 20px; cursor: pointer; flex-shrink: 0; }
  #attach-btn { margin-right: 8px; padding: 10px 14px; background: #eee; color: #333; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; flex-shrink: 0; }

  #notes-list { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .note-item { background: #fffbe6; border: 1px solid #f0e4a0; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .note-meta { font-size: 11px; color: #8a7a2c; margin-bottom: 4px; }
  .note-text { white-space: pre-wrap; word-wrap: break-word; }
  .note-file { margin-top: 6px; }
  .note-file a { color: #06834a; font-size: 12px; }
  .notes-empty { color: #999; font-size: 13px; padding: 16px; }

  #note-input-row { border-top: 1px solid #ddd; background: #fff; padding: 10px; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #note-text { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; resize: vertical; }
  #note-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  #note-actions button { padding: 8px 16px; border: none; border-radius: 16px; cursor: pointer; }
  #note-attach-btn { background: #eee; color: #333; }
  #note-send-btn { background: #d9a900; color: #fff; }

  #profile-content { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .profile-empty { padding: 24px 16px; text-align: center; color: #666; font-size: 14px; }
  .profile-card { padding: 8px 0; }
  .profile-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .profile-label { color: #888; flex-shrink: 0; }
  .profile-value { text-align: right; word-break: break-word; }
  .profile-empty button, .resend-btn { margin-top: 14px; padding: 10px 18px; background: #06c755; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .resend-btn { display: block; margin: 14px auto 0; }

  #cross-oa-section { margin-top: 20px; }
  .cross-oa-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 8px; }
  .cross-oa-loading, .cross-oa-empty { font-size: 13px; color: #999; padding: 8px 0; }
  .cross-oa-card { background: #f7f9fc; border: 1px solid #e3e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .cross-oa-name { font-size: 14px; font-weight: 600; color: #2c3e50; }
  .cross-oa-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .cross-oa-assigned { font-size: 12px; color: #06834a; margin-top: 4px; }

  #placeholder { margin: auto; color: #999; padding: 16px; text-align: center; }

  @media (max-width: 768px) {
    body { position: relative; }
    #sidebar { width: 100%; border-right: none; }
    #chat { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f4f4f4; transform: translateX(100%); transition: transform 0.2s ease; z-index: 10; }
    #back-btn { display: inline-block; }
    body.chat-open #sidebar { display: none; }
    body.chat-open #chat { transform: translateX(0); }
    .bubble { max-width: 85%; }
    #chat-header { padding-top: max(12px, env(safe-area-inset-top)); }
    #assign-select { max-width: 100%; order: 3; flex-basis: 100%; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="channel-bar"></div>
    <div id="identity-bar"></div>
    <div id="search-bar">
      <input type="text" id="search-input" placeholder="ค้นหาชื่อลูกค้า..." />
    </div>
    <div id="conv-list"><div id="empty-list">รอข้อความจากลูกค้า...</div></div>
  </div>
  <div id="chat">
    <div id="placeholder">เลือกบทสนทนาทางซ้ายเพื่อตอบแชท</div>
  </div>

<script>
let currentUserId = null;
let currentUserName = null;
let currentTab = 'chat';
let currentUser = null;
let teamRoster = [];
let allConversations = [];
let channels = [];
let currentChannel = null;

const QUICK_REPLIES = [
  { label: 'ทักทาย', text: 'สวัสดีค่ะ/ครับ ขอบคุณที่สนใจโครงการของเรา รบกวนสอบถามงบประมาณและประเภทห้องที่สนใจได้ไหมคะ' },
  { label: 'ขอเบอร์ติดต่อ', text: 'รบกวนขอเบอร์ติดต่อกลับ หรือแจ้งเวลาที่สะดวกให้ทีมงานติดต่อกลับได้ไหมคะ' },
  { label: 'แจ้งราคา', text: 'ราคาเริ่มต้นของโครงการอยู่ที่ ... บาท มีโปรโมชั่นพิเศษสำหรับผู้จองในเดือนนี้ด้วยค่ะ' },
  { label: 'นัดชมโครงการ', text: 'สนใจนัดเข้าชมโครงการไหมคะ วันไหนสะดวกดีคะ ทีมงานยินดีพาชมค่ะ' },
  { label: 'ขอบคุณ', text: 'ขอบคุณมากค่ะ ทางทีมงานจะติดต่อกลับโดยเร็วที่สุดค่ะ' },
];

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function init() {
  const meRes = await fetch('/api/me');
  if (!meRes.ok) {
    window.location.href = '/login';
    return;
  }
  currentUser = await meRes.json();
  renderIdentityBar();

  try {
    channels = await fetch('/api/channels').then(r => r.json());
  } catch (e) {
    channels = [];
  }
  const savedChannel = localStorage.getItem('lineOaChannel');
  currentChannel = (savedChannel && channels.some(c => c.key === savedChannel))
    ? savedChannel
    : (channels[0] ? channels[0].key : null);
  renderChannelBar();

  try {
    teamRoster = await fetch('/api/team').then(r => r.json());
  } catch (e) {
    teamRoster = [];
  }

  document.getElementById('search-input').addEventListener('input', renderConversationList);
  document.getElementById('conv-list').addEventListener('click', e => {
    const item = e.target.closest('.conv-item');
    if (!item) return;
    selectConversation(item.dataset.userId, item.dataset.name);
  });

  loadConversations();
  setInterval(() => {
    loadConversations();
    if (currentTab === 'chat') loadMessages();
    else if (currentTab === 'notes') loadNotes();
    else if (currentTab === 'profile') loadProfile();
  }, 3000);
}

function renderChannelBar() {
  const bar = document.getElementById('channel-bar');
  if (!channels || channels.length === 0) {
    bar.innerHTML = '<div id="channel-name">LINE OA External Chat</div>';
    return;
  }
  if (channels.length === 1) {
    bar.innerHTML = `<div id="channel-name">${escapeHtml(channels[0].name)}</div>`;
    return;
  }
  bar.innerHTML = `<select id="channel-select">${channels.map(c =>
    `<option value="${escapeAttr(c.key)}" ${c.key === currentChannel ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
  ).join('')}</select>`;
  document.getElementById('channel-select').addEventListener('change', onChannelChange);
}

function onChannelChange(e) {
  currentChannel = e.target.value;
  localStorage.setItem('lineOaChannel', currentChannel);
  currentUserId = null;
  currentUserName = null;
  document.body.classList.remove('chat-open');
  document.getElementById('chat').innerHTML = '<div id="placeholder">เลือกบทสนทนาทางซ้ายเพื่อตอบแชท</div>';
  loadConversations();
}

function renderIdentityBar() {
  const bar = document.getElementById('identity-bar');
  const avatar = currentUser.photo_url
    ? `<img id="identity-avatar" src="${escapeAttr(currentUser.photo_url)}" />`
    : '';
  bar.innerHTML = `
    ${avatar}
    <span id="current-user-name">${escapeHtml(currentUser.display_name)}</span>
    <button id="photo-btn" title="อัปโหลดรูปโปรไฟล์ (ลูกค้าจะเห็นรูปนี้ตอนคุณตอบแชท)">📷</button>
    <input type="file" id="photo-file-input" accept="image/*" style="display:none" />
    <button id="change-pw-btn" title="เปลี่ยนรหัสผ่าน">🔑</button>
    ${currentUser.role === 'admin' ? '<button id="admin-link-btn" title="จัดการบัญชี">👥</button>' : ''}
    <button id="logout-btn" title="ออกจากระบบ">ออก</button>
  `;
  document.getElementById('change-pw-btn').addEventListener('click', changePassword);
  document.getElementById('photo-btn').addEventListener('click', () => {
    document.getElementById('photo-file-input').click();
  });
  document.getElementById('photo-file-input').addEventListener('change', uploadMyPhoto);
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });
  const adminBtn = document.getElementById('admin-link-btn');
  if (adminBtn) {
    adminBtn.addEventListener('click', () => { window.location.href = '/admin'; });
  }
}

async function uploadMyPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/me/photo', { method: 'POST', body: fd });
  e.target.value = '';
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert('อัปโหลดรูปไม่สำเร็จ: ' + (err.detail || ''));
    return;
  }
  currentUser = await fetch('/api/me').then(r => r.json());
  renderIdentityBar();
  alert('อัปเดตรูปโปรไฟล์แล้ว ลูกค้าจะเห็นรูปนี้ในข้อความที่คุณตอบต่อไปนี้');
}

async function changePassword() {
  const current = prompt('รหัสผ่านเดิม:');
  if (current == null) return;
  const next = prompt('รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร):');
  if (next == null) return;
  const res = await fetch('/api/me/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current_password: current, new_password: next }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert('เปลี่ยนรหัสผ่านไม่สำเร็จ: ' + (err.detail || ''));
    return;
  }
  alert('เปลี่ยนรหัสผ่านเรียบร้อย');
}

async function loadConversations() {
  if (!currentChannel) {
    allConversations = [];
    renderConversationList();
    return;
  }
  const res = await fetch(`/api/${currentChannel}/conversations`);
  allConversations = await res.json();
  renderConversationList();
}

function renderConversationList() {
  const term = document.getElementById('search-input').value.trim().toLowerCase();
  const list = document.getElementById('conv-list');
  const filtered = term
    ? allConversations.filter(c => (c.display_name || c.user_id || '').toLowerCase().includes(term))
    : allConversations;

  if (filtered.length === 0) {
    list.innerHTML = `<div id="empty-list">${term ? 'ไม่พบแชทที่ค้นหา' : 'รอข้อความจากลูกค้า...'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const t = new Date(c.last_at * 1000).toLocaleString('th-TH');
    const assigned = teamRoster.find(s => String(s.id) === String(c.assigned_to));
    const badge = assigned
      ? `<span class="assign-badge" style="background:${assigned.color}">${escapeHtml(assigned.display_name)}</span>`
      : `<span class="assign-badge unassigned">ยังไม่มอบหมาย</span>`;
    return `
      <div class="conv-item ${c.user_id === currentUserId ? 'active' : ''}" data-user-id="${escapeAttr(c.user_id)}" data-name="${escapeAttr(c.display_name || c.user_id)}">
        <div class="name">${escapeHtml(c.display_name || c.user_id)}</div>
        <div class="time">${t}</div>
        ${badge}
      </div>
    `;
  }).join('');
}

function selectConversation(userId, name) {
  currentUserId = userId;
  currentUserName = name || userId;
  currentTab = 'chat';
  renderChatFrame();
  loadConversations();
  document.body.classList.add('chat-open');
}

function goBackToList() {
  document.body.classList.remove('chat-open');
}

function switchTab(tab) {
  currentTab = tab;
  renderChatFrame();
}

function renderChatFrame() {
  const conv = allConversations.find(c => c.user_id === currentUserId);
  const assignedTo = conv ? conv.assigned_to : null;
  const assignOptions = ['<option value="">ยังไม่มอบหมาย</option>']
    .concat(teamRoster.map(s =>
      `<option value="${escapeAttr(s.id)}" ${String(s.id) === String(assignedTo) ? 'selected' : ''}>${escapeHtml(s.display_name)}</option>`
    )).join('');

  document.getElementById('chat').innerHTML = `
    <div id="chat-header">
      <button id="back-btn" onclick="goBackToList()">‹</button>
      <span id="chat-title">${escapeHtml(currentUserName)}</span>
      <select id="assign-select">${assignOptions}</select>
    </div>
    <div id="tab-bar">
      <button class="tab-btn ${currentTab === 'chat' ? 'active' : ''}" data-tab="chat">แชท</button>
      <button class="tab-btn ${currentTab === 'notes' ? 'active' : ''}" data-tab="notes">โน้ตภายใน</button>
      <button class="tab-btn ${currentTab === 'profile' ? 'active' : ''}" data-tab="profile">ข้อมูลลูกค้า</button>
    </div>
    <div id="tab-content"></div>
  `;

  document.getElementById('assign-select').addEventListener('change', onAssignChange);
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  if (currentTab === 'chat') {
    renderChatTabContent();
    loadMessages();
  } else if (currentTab === 'notes') {
    renderNotesTabContent();
    loadNotes();
  } else {
    renderProfileTabContent();
    loadProfile();
  }
}

async function onAssignChange(e) {
  const val = e.target.value || null;
  await fetch(`/api/${currentChannel}/conversations/${currentUserId}/assign`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ assigned_to: val })
  });
  loadConversations();
}

function renderChatTabContent() {
  document.getElementById('tab-content').innerHTML = `
    <div id="quick-replies">
      ${QUICK_REPLIES.map((q, i) => `<button class="qr-btn" data-idx="${i}">${escapeHtml(q.label)}</button>`).join('')}
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <button id="attach-btn" title="แนบรูป/ไฟล์">📎</button>
      <input type="file" id="file-input" style="display:none" />
      <input id="msg-input" type="text" placeholder="พิมพ์ข้อความตอบกลับ..." />
      <button id="send-btn">ส่ง</button>
    </div>
  `;
  document.getElementById('send-btn').addEventListener('click', sendReply);
  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendReply();
  });
  document.getElementById('attach-btn').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', handleFileSelected);
  document.querySelectorAll('.qr-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = QUICK_REPLIES[parseInt(btn.dataset.idx, 10)];
      const input = document.getElementById('msg-input');
      input.value = q.text;
      input.focus();
    });
  });
}

function renderNotesTabContent() {
  document.getElementById('tab-content').innerHTML = `
    <div id="notes-list"></div>
    <div id="note-input-row">
      <textarea id="note-text" placeholder="เขียนโน้ตภายใน (ลูกค้าไม่เห็นข้อความนี้)..." rows="2"></textarea>
      <div id="note-actions">
        <input type="file" id="note-file-input" style="display:none" />
        <button id="note-attach-btn" title="แนบไฟล์">📎 แนบไฟล์</button>
        <button id="note-send-btn">บันทึกโน้ต</button>
      </div>
    </div>
  `;
  document.getElementById('note-send-btn').addEventListener('click', addNote);
  document.getElementById('note-attach-btn').addEventListener('click', () => {
    document.getElementById('note-file-input').click();
  });
}

function renderBubble(m) {
  const sender = (m.direction === 'out' && m.sender_name)
    ? `<div class="bubble-sender">${escapeHtml(m.sender_name)}</div>`
    : '';
  let inner;
  if (m.msg_type === 'image' && m.media_id) {
    inner = `<div class="bubble ${m.direction} media"><img src="/media/${m.media_id}" onclick="window.open('/media/${m.media_id}', '_blank')" /></div>`;
  } else if (m.msg_type === 'file' && m.media_id) {
    inner = `<div class="bubble ${m.direction} media"><a href="/media/${m.media_id}" target="_blank">📎 ${escapeHtml(m.text || 'ไฟล์แนบ')}</a></div>`;
  } else {
    inner = `<div class="bubble ${m.direction}">${escapeHtml(m.text)}</div>`;
  }
  return `<div class="msg-row ${m.direction}">${sender}${inner}</div>`;
}

async function loadMessages() {
  if (!currentUserId) return;
  const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/messages`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  if (!box) return;
  box.innerHTML = msgs.map(renderBubble).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendReply() {
  const input = document.getElementById('msg-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || !currentUserId) return;
  input.value = '';
  const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/reply`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (!res.ok) {
    alert('ส่งไม่สำเร็จ: ' + await res.text());
  }
  loadMessages();
}

async function handleFileSelected(e) {
  const fileInput = e.target;
  const file = fileInput.files[0];
  if (!file || !currentUserId) return;
  const kind = file.type.startsWith('image/') ? 'image' : 'file';
  const formData = new FormData();
  formData.append('file', file);
  formData.append('kind', kind);
  const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/reply-media`, {
    method: 'POST',
    body: formData
  });
  if (!res.ok) {
    alert('ส่งไม่สำเร็จ: ' + await res.text());
  }
  fileInput.value = '';
  loadMessages();
}

async function loadNotes() {
  if (!currentUserId) return;
  const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/notes`);
  const notes = await res.json();
  const box = document.getElementById('notes-list');
  if (!box) return;
  if (notes.length === 0) {
    box.innerHTML = '<div class="notes-empty">ยังไม่มีโน้ตสำหรับแชทนี้</div>';
    return;
  }
  box.innerHTML = notes.map(n => {
    const t = new Date(n.created_at * 1000).toLocaleString('th-TH');
    const fileHtml = n.media_id
      ? `<div class="note-file"><a href="/media/${n.media_id}" target="_blank">📎 ไฟล์แนบ</a></div>`
      : '';
    return `
      <div class="note-item">
        <div class="note-meta"><strong>${escapeHtml(n.author || 'ไม่ระบุ')}</strong> · ${t}</div>
        <div class="note-text">${escapeHtml(n.text)}</div>
        ${fileHtml}
      </div>
    `;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function addNote() {
  if (!currentUserId) return;
  const textEl = document.getElementById('note-text');
  const fileEl = document.getElementById('note-file-input');
  const text = textEl.value.trim();
  const file = fileEl.files[0];
  if (!text && !file) return;

  let res;
  if (file) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('text', text);
    res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/notes-media`, { method: 'POST', body: fd });
  } else {
    res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/notes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
  }
  if (!res.ok) {
    alert('บันทึกไม่สำเร็จ: ' + await res.text());
    return;
  }
  textEl.value = '';
  fileEl.value = '';
  loadNotes();
}

function renderProfileTabContent() {
  document.getElementById('tab-content').innerHTML = `
    <div id="profile-content"><div class="profile-empty">กำลังโหลด...</div></div>
  `;
}

async function loadProfile() {
  if (!currentUserId) return;
  const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/profile`);
  const p = await res.json();
  const box = document.getElementById('profile-content');
  if (!box) return;

  const hasData = p && (p.email || p.first_name || p.last_name || p.phone || p.birthday);

  if (!hasData) {
    box.innerHTML = `
      <div class="profile-empty">
        <div>ยังไม่มีข้อมูลลูกค้าคนนี้ (อีเมล/เบอร์โทร/ชื่อ-นามสกุล/วันเกิด)</div>
        <button id="send-link-btn">ส่งลิงก์ขอข้อมูลเพิ่มเติม</button>
      </div>
    `;
    document.getElementById('send-link-btn').addEventListener('click', sendRegistrationLink);
    return;
  }

  const fullName = [p.first_name, p.last_name].filter(Boolean).join(' ') || '-';
  const updated = p.updated_at ? new Date(p.updated_at * 1000).toLocaleString('th-TH') : '-';
  box.innerHTML = `
    <div class="profile-card">
      <div class="profile-row"><span class="profile-label">ชื่อ-นามสกุล</span><span class="profile-value">${escapeHtml(fullName)}</span></div>
      <div class="profile-row"><span class="profile-label">อีเมล</span><span class="profile-value">${escapeHtml(p.email || '-')}</span></div>
      <div class="profile-row"><span class="profile-label">เบอร์โทร</span><span class="profile-value">${escapeHtml(p.phone || '-')}</span></div>
      <div class="profile-row"><span class="profile-label">วันเกิด</span><span class="profile-value">${escapeHtml(p.birthday || '-')}</span></div>
      <div class="profile-row"><span class="profile-label">อัปเดตล่าสุด</span><span class="profile-value">${updated}</span></div>
    </div>
    <button id="send-link-btn" class="resend-btn">ส่งลิงก์ขอข้อมูลอีกครั้ง</button>
    <div id="cross-oa-section"></div>
  `;
  document.getElementById('send-link-btn').addEventListener('click', sendRegistrationLink);
  loadCrossOaHistory();
}

async function loadCrossOaHistory() {
  const section = document.getElementById('cross-oa-section');
  if (!section || !currentUserId) return;
  section.innerHTML = '<div class="cross-oa-title">เคยทักติดต่อโครงการอื่นด้วย</div><div class="cross-oa-loading">กำลังโหลด...</div>';
  try {
    const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/cross-oa-history`);
    const rows = await res.json();
    if (!res.ok || !Array.isArray(rows) || rows.length === 0) {
      section.innerHTML = '<div class="cross-oa-title">เคยทักติดต่อโครงการอื่นด้วย</div><div class="cross-oa-empty">ไม่พบว่าเคยทักโครงการอื่น (จับคู่จากอีเมล/เบอร์โทรที่กรอกไว้)</div>';
      return;
    }
    section.innerHTML = `
      <div class="cross-oa-title">เคยทักติดต่อโครงการอื่นด้วย</div>
      ${rows.map(r => `
        <div class="cross-oa-card">
          <div class="cross-oa-name">${escapeHtml(r.channel_name)}</div>
          <div class="cross-oa-meta">คุยล่าสุด ${new Date(r.last_at * 1000).toLocaleString('th-TH')} · ${r.message_count} ข้อความ</div>
          ${r.assigned_to_name ? `<div class="cross-oa-assigned">ผู้ดูแล: ${escapeHtml(r.assigned_to_name)}</div>` : ''}
        </div>
      `).join('')}
    `;
  } catch (e) {
    section.innerHTML = '';
  }
}

async function sendRegistrationLink() {
  if (!currentUserId) return;
  const btn = document.getElementById('send-link-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'กำลังส่ง...';
  }
  try {
    const res = await fetch(`/api/${currentChannel}/conversations/${currentUserId}/send-registration-link`, { method: 'POST' });
    if (!res.ok) {
      alert('ส่งลิงก์ไม่สำเร็จ: ' + await res.text());
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'ส่งลิงก์ขอข้อมูลเพิ่มเติม';
      }
      return;
    }
    alert('ส่งลิงก์ให้ลูกค้าทาง LINE แล้ว');
  } catch (err) {
    alert('ส่งลิงก์ไม่สำเร็จ: ' + err.message);
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'ส่งลิงก์ขอข้อมูลเพิ่มเติม';
    }
  }
}

init();
</script>
</body>
</html>
