<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LINE OA External Chat POC</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { margin: 0; display: flex; height: 100vh; background: #f4f4f4; }
  #sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
  #sidebar h2 { font-size: 15px; padding: 16px; margin: 0; border-bottom: 1px solid #eee; }
  .conv-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .conv-item:hover, .conv-item.active { background: #e8f5e9; }
  .conv-item .name { font-weight: 600; font-size: 14px; }
  .conv-item .time { font-size: 11px; color: #888; margin-top: 2px; }
  #empty-list { padding: 16px; color: #999; font-size: 13px; }
  #chat { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 14px 20px; background: #06c755; color: #fff; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 60%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .bubble.in { background: #fff; align-self: flex-start; border: 1px solid #eee; }
  .bubble.out { background: #06c755; color: #fff; align-self: flex-end; }
  #input-row { display: flex; padding: 12px; border-top: 1px solid #ddd; background: #fff; }
  #input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; }
  #input-row button { margin-left: 8px; padding: 10px 18px; background: #06c755; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
  #placeholder { margin: auto; color: #999; }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>บทสนทนา (LINE OA)</h2>
    <div id="conv-list"><div id="empty-list">รอข้อความจากลูกค้า...</div></div>
  </div>
  <div id="chat">
    <div id="placeholder">เลือกบทสนทนาทางซ้ายเพื่อตอบแชท</div>
  </div>

<script>
let currentUserId = null;

async function loadConversations() {
  const res = await fetch('/api/conversations');
  const convs = await res.json();
  const list = document.getElementById('conv-list');
  if (convs.length === 0) {
    list.innerHTML = '<div id="empty-list">รอข้อความจากลูกค้า...</div>';
    return;
  }
  list.innerHTML = '';
  convs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.user_id === currentUserId ? ' active' : '');
    const t = new Date(c.last_at * 1000).toLocaleString('th-TH');
    div.innerHTML = `<div class="name">${escapeHtml(c.display_name || c.user_id)}</div><div class="time">${t}</div>`;
    div.onclick = () => selectConversation(c.user_id, c.display_name);
    list.appendChild(div);
  });
}

function selectConversation(userId, name) {
  currentUserId = userId;
  renderChatFrame(name || userId);
  loadMessages();
  loadConversations();
}

function renderChatFrame(name) {
  document.getElementById('chat').innerHTML = `
    <div id="chat-header">${escapeHtml(name)}</div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="msg-input" type="text" placeholder="พิมพ์ข้อความตอบกลับ..." />
      <button id="send-btn">ส่ง</button>
    </div>
  `;
  document.getElementById('send-btn').addEventListener('click', sendReply);
  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendReply();
  });
}

async function loadMessages() {
  if (!currentUserId) return;
  const res = await fetch(`/api/conversations/${currentUserId}/messages`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  if (!box) return;
  box.innerHTML = msgs.map(m =>
    `<div class="bubble ${m.direction}">${escapeHtml(m.text)}</div>`
  ).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendReply() {
  const input = document.getElementById('msg-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || !currentUserId) return;
  input.value = '';
  const res = await fetch(`/api/conversations/${currentUserId}/reply`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (!res.ok) {
    alert('ส่งไม่สำเร็จ: ' + await res.text());
  }
  loadMessages();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str == null ? '' : str;
  return div.innerHTML;
}

loadConversations();
setInterval(() => {
  loadConversations();
  loadMessages();
}, 3000);
</script>
</body>
</html>
